name: 编译并发布

# 每个分支推送都编译和测试；只有 main 发布 Release（面板里的「下载最新版」指向它）。
# 版本号用同一个工作流的运行序号，分支上编出来的包也能直接覆盖安装旧版本。
on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: 还原签名密钥
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          test -n "$SIGN_KEYSTORE_B64" || { echo "缺少 SIGN_KEYSTORE_B64"; exit 1; }
          echo "$SIGN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign.keystore"
      - name: 运行单元测试并打包
        env:
          SIGN_KEYSTORE: ${{ runner.temp }}/sign.keystore
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: 上传分支安装包
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shengguang-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
      - name: 发布
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk shengguang.apk
          # 更新说明用提交信息，去掉末尾的署名行
          notes="$(git log -1 --format=%B | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:')"
          printf '%s\n\n提交 %s\n' "$notes" "$GITHUB_SHA" > notes.md
          gh release create "v${GITHUB_RUN_NUMBER}" shengguang.apk --target "$GITHUB_SHA" --title "声光 v${GITHUB_RUN_NUMBER}" --notes-file notes.md
