name: 编译并发布

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: 还原签名密钥
        env:
          SIGN_KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          test -n "$SIGN_KEYSTORE_B64" || { echo "缺少 SIGN_KEYSTORE_B64"; exit 1; }
          echo "$SIGN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sign.keystore"
      - name: 运行单元测试并打包
        env:
          SIGN_KEYSTORE: ${{ runner.temp }}/sign.keystore
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk shengguang.apk
          gh release create "v${GITHUB_RUN_NUMBER}" shengguang.apk --target "$GITHUB_SHA" --title "声光 v${GITHUB_RUN_NUMBER}" --notes "提交 ${GITHUB_SHA}"
